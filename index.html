
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGON FIT PRO | Neural Training Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --argon-emerald: #10B981;
            --argon-glow: rgba(16, 185, 129, 0.4);
            --argon-black: #050706;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--argon-black);
            color: #E2E8F0;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }
        .font-tech { font-family: 'JetBrains Mono', monospace; }
        .font-heading { font-family: 'Space Grotesk', sans-serif; }
        
        /* Animated Tactical Grid */
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            position: fixed;
            inset: 0;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .glass-premium {
            background: rgba(10, 15, 12, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .glow-text {
            text-shadow: 0 0 20px var(--argon-glow);
        }

        /* Scanning Line Animation */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to bottom, transparent, var(--argon-emerald), transparent);
            opacity: 0.1;
            pointer-events: none;
            z-index: 100;
            animation: scanline 8s linear infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--argon-black); }
        ::-webkit-scrollbar-thumb { background: #151B18; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--argon-emerald); }
    </style>
<script type="importmap">

    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.39.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div class="bg-grid"></div>
    <div class="scanline"></div>
    <div id="root"></div>

</html>
